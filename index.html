<!DOCTYPE html>
<html>
    <head lang="ru">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
        <title>Logbook</title>
        <script src="markdown-it.min.js"></script>
        <!-- Подключаем наш внешний чистый файл стилей -->
        <link rel="stylesheet" href="styles.css">

        <!-- Подключаем паспорт PWA приложения -->
        <link rel="manifest" href="manifest.json">

        <!-- Скрипт автоматического запуска Service Worker -->
        <script>
            if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('🎉 PWA Service Worker успешно запущен!', reg.scope))
                .catch(err => console.error('❌ Ошибка запуска Service Worker:', err));
            });
            }
        </script>
    </head>
    <body>
        <!-- Экран ввода мастер-пароля -->
        <div id="lock-screen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #fcfbfa; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
            <h2 style="text-transform: uppercase; letter-spacing: 2px; font-size: 18px; color: #4a4a4a;">Logbook</h2>
            <input type="password" id="master-password-input" placeholder="Введите мастер-пароль..." style="padding: 12px; font-family: inherit; font-size: 16px; border: 2px solid #1a1a1a; width: 260px; text-align: center; outline: none; background-color: #f5f4f0;">
            <button id="btn-unlock" style="width: 260px; padding: 12px;">🔓 Разблокировать</button>
        </div>

        <script>
          // Ловим любые стандартные ошибки JavaScript
          window.onerror = function(message, source, lineno, colno, error) {
            alert("КРИТИЧЕСКАЯ ОШИБКА JS:\n" + message + "\nСтрока: " + lineno);
            return false;
          };

          // Ловим ошибки, связанные с асинхронными обещаниями
          window.addEventListener('unhandledrejection', function(event) {
            alert("ОШИБКА БАЗЫ ДАННЫХ / АСИНХРОННОСТИ:\n" + event.reason);
          });
        </script>

        <div class="app-container">
            <div id="sidebar-overlay" class="sidebar-overlay"></div>

            <!-- ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ -->
            <aside class="sidebar">
                <h2>Logbook</h2>
                <button id="btn-journal">📅 Журнал</button>

                <div class="create-page-area" style="margin-top: 15px; margin-bottom: 15px; display: flex; gap: 5px;">
                    <input type="text" id="new-page-input" placeholder="Новая страница..." style="width: 100%; padding: 5px; box-sizing: border-box;">
                    <button id="btn-create-page" style="padding: 5px 10px;">+</button>
                </div>

                <!-- ПОЛЕ ДЛЯ МГНОВЕННОГО ЛОКАЛЬНОГО ПОИСКА -->
                <div class="search-area" style="margin-bottom: 15px; position: relative;">
                    <input type="text" id="search-input" placeholder="🔍 Поиск по заметкам..." style="width: 100%; padding: 8px 12px 8px 30px; box-sizing: border-box; border: 1px solid #d1d0c9; border-radius: 6px; background-color: #fcfbfa; font-family: inherit; font-size: 14px; outline: none;">
                </div>

                <!-- НОВЫЙ СТРУКТУРИРОВАННЫЙ САЙДБАР -->
                <div class="sidebar-sections-container" style="overflow-y: auto; flex-grow: 1; margin-bottom: 10px; padding-right: 4px;">

                    <!-- РАЗДЕЛ: ПОСЛЕДНИЕ -->
                    <div class="sidebar-section">
                        <div class="section-header" id="header-recent" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 6px 0; font-weight: 700; color: #7c7c77; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                            <span>⏳ Последние</span>
                            <span class="section-arrow">▼</span>
                        </div>
                        <ul id="list-recent" style="list-style: none; padding: 0; margin: 0; margin-bottom: 10px;"></ul>
                    </div>

                    <!-- РАЗДЕЛ: ЖУРНАЛ -->
                    <div class="sidebar-section">
                        <div class="section-header" id="header-journals" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 6px 0; font-weight: 700; color: #7c7c77; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                            <span>📅 Журнал</span>
                            <span class="section-arrow">▼</span>
                        </div>
                        <ul id="list-journals" style="list-style: none; padding: 0; margin: 0; margin-bottom: 10px;"></ul>
                    </div>

                    <!-- РАЗДЕЛ: ЗАМЕТКИ -->
                    <div class="sidebar-section">
                        <div class="section-header" id="header-notes" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 6px 0; font-weight: 700; color: #7c7c77; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                            <span>📝 Заметки</span>
                            <span class="section-arrow">▼</span>
                        </div>
                        <ul id="list-notes" style="list-style: none; padding: 0; margin: 0; margin-bottom: 10px;"></ul>
                    </div>

                    <!-- РАЗДЕЛ: ТЕГИ -->
                    <div class="sidebar-section">
                        <div class="section-header" id="header-tags" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 6px 0; font-weight: 700; color: #7c7c77; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                            <span>🏷️ Теги</span>
                            <span class="section-arrow">▼</span>
                        </div>
                        <ul id="list-tags" style="list-style: none; padding: 0; margin: 0; margin-bottom: 10px;"></ul>
                    </div>

                </div>

                <!-- Контейнер, куда будут выводиться результаты поиска -->
                <ul id="search-results" style="list-style: none; padding: 0; margin: 0; display: none; overflow-y: auto; flex-grow: 1;"></ul>

                <div class="sidebar-footer">
                    <button id="btn-export" title="Export">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M440-320v-327L322-529l-56-57 214-214 214 214-56 57-118-118v327h-80Zm160 160v-80h160v-320H680v-80h80q33 0 56.5 23.5T840-640v320q0 33-23.5 56.5T760-160H600Zm-360 0q-33 0-56.5-23.5T160-240v-320q0-33 23.5-56.5T240-640h80v80h-80v320h160v80H240Z"/></svg>
                    </button>
                    <button id="btn-import" title="Import">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M480-320 266-534l56-57 118 118v-327h80v327l118-118 56 57-214 214Zm120 160v-80h160v-320H680v-80h80q33 0 56.5 23.5T840-640v320q0 33-23.5 56.5T760-160H600Zm-360 0q-33 0-56.5-23.5T160-240v-320q0-33 23.5-56.5T240-640h80v80h-80v320h160v80H240Z"/></svg>
                    </button>
                </div>
            </aside>

            <!-- ОБЛАСТЬ ОСНОВНОГО КОНТЕНТА -->
            <main class="main-content">
                <!-- ОНОВЛЕННАЯ СТРYКТYРA ШAПКИ С КНОПКAМИ НАВИГАЦИИ -->
                <div class="header-area">
                    <div class="header-left-group">
                        <button id="btn-menu" class="btn-toggle-sidebar">☰</button>

                        <!-- КНОПКИ ЛИСТАНИЯ СТРАНИЦ (НАЗАД / ВПЕРЕД) -->
                        <!-- СТАНЕТ: -->
                        <div class="nav-buttons-group">
                            <button id="btn-nav-back" title="Назад" class="btn-nav-arrow">
                                <svg xmlns="http://w3.org" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg>
                            </button>
                            <button id="btn-nav-forward" title="Вперед" class="btn-nav-arrow">
                                <svg xmlns="http://w3.org" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor"><path d="M359-240l-56-56 184-184-184-184 56-56 240 240-240 240Z"/></svg>
                            </button>

                            <!-- НОВАЯ УМНАЯ КНОПКА СВЕРНУТЬ / РАЗВЕРНУТЬ ВСЁ -->
                            <button id="btn-toggle-all" title="Свернуть / Развернуть все блоки" class="btn-nav-arrow">
                                <svg xmlns="http://w3.org" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor"><path d="M480-480q-17 0-28.5-11.5T440-520q0-17 11.5-28.5T480-560q17 0 28.5 11.5T520-520q0 17-11.5 28.5T480-480Zm0 320q-17 0-28.5-11.5T440-200q0-17 11.5-28.5T480-240q17 0 28.5 11.5T520-200q0 17-11.5 28.5T480-160Zm0-640q-17 0-28.5-11.5T440-840q0-17 11.5-28.5T480-880q17 0 28.5 11.5T520-840q0 17-11.5 28.5T480-800ZM120-120v-80h720v80H120Zm0-320v-80h720v80H120Zm0-320v-80h720v80H120Z"/></svg>
                            </button>
                        </div>
                    </div>
                    <h1 id="page-title">Заголовок страницы</h1>
                </div>


                <!-- WYSIWYG ПАНЕЛЬ ИНСТРУМЕНТОВ GOOGLE MATERIAL ICONS -->
                <!-- ОБНОВЛЕННАЯ ИНФОРМАТИВНАЯ WYSIWYG ПАНЕЛЬ ИНСТРУМЕНТОВ -->
                <div id="wysiwyg-toolbar" class="wysiwyg-toolbar" style="display: none;">
                    <!-- Сдвиги по уровням (Влево / Вправо) -->
                    <button id="btn-toolbar-left" title="Сдвинуть влево (Уменьшить вложенность)">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M440-240 200-480l240-240 56 56-144 144h408v80H352l144 144-56 56Z"/></svg>
                    </button>
                    <button id="btn-toolbar-right" title="Сдвинуть вправо (Увеличить вложенность)">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M520-240l-56-56 144-144H200v-80h408L464-664l56-56 240 240-240 240Z"/></svg>
                    </button>

                    <div class="toolbar-separator"></div>

                    <!-- Перемещение веток (Выше / Ниже) -->
                    <button id="btn-toolbar-up" title="Переместить ветку выше">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M440-160v-487L298-505l-56-56 238-239 238 239-56 56-142-142v487h-80Z"/></svg>
                    </button>
                    <button id="btn-toolbar-down" title="Переместить ветку ниже">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M480-160 242-399l56-56 142 142v-487h80v487l142-142 56 56L480-160Z"/></svg>
                    </button>

                    <div class="toolbar-separator"></div>

                    <!-- Создание новых строк (Плюс сверху / Плюс снизу) — ТЕПЕРЬ ОНИ С ПЛЮСАМИ! -->
                    <button id="btn-toolbar-above" onclick="window.toolbarInsertAbove(event)" title="Вставить строку выше">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240ZM160-120v-80h640v80H160Z"/></svg>
                    </button>
                    <button id="btn-toolbar-below" onclick="window.toolbarInsertBelow(event)" title="Вставить строку ниже">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M160-840v80h640v-80H160Zm280 400H200v80h240v240h80v-240h240v-80H520v-240h-80v240Z"/></svg>
                    </button>

                    <div class="toolbar-separator"></div>

                    <!-- ИСПРАВЛЕННАЯ СТРЕЛКА: СМОТРИТ ВНИЗ И ВЛЕВО -->
                    <button id="btn-toolbar-newline" title="Перенос строки внутри блока (Shift+Enter)">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
                          <path d="M240-560v240h360v-240h80v320H240l144 144-56 56-240-250 240-250 56 56-144 144Z"/>
                        </svg>
                    </button>

                    <div class="toolbar-separator"></div>

                    <!-- Ссылка и Удаление -->
                    <button id="btn-toolbar-copy" title="Скопировать ссылку на блок">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M440-280H280q-83 0-141.5-58.5T80-480q0-83 58.5-141.5T280-680h160v80H280q-50 0-85 35t-35 85q0 50 35 85t85 35h160v80ZM320-440v-80h320v80H320Zm200 160v-80h160q50 0 85-35t35-85q0-50-35-85t-85-35H520v-80h160q83 0 141.5 58.5T880-480q0 83-58.5 141.5T680-280H520Z"/></svg>
                    </button>
                    <button id="btn-toolbar-delete" title="Удалить строку" class="toolbar-delete-btn">
                        <svg xmlns="http://w3.org" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                    </button>
                </div>

                <!-- Контейнер для вывода связанных блоков и тегов (Linked References) -->
                <div id="linked-references-area" style="margin-top: 40px; padding-top: 20px; border-top: 2px dashed #e3e2dc; display: none;">
                    <h3 style="font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #7c7c77; margin-bottom: 15px;">🔗 Упоминания на других страницах:</h3>
                    <ul id="linked-references-list" style="list-style: none; padding-left: 0; margin-0;"></ul>
                </div>

                <div id="editor">
                    <ul id="blocks-list" style="padding-left: 0px !important; margin-left: 0px !important;"></ul>
                </div>
            </main>
        </div>

        <!-- Кастомное контекстное меню для удаления страниц -->
        <div id="context-menu" style="display: none; position: absolute; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-radius: 4px; z-index: 1000;">
            <button id="btn-delete-page" style="color: red; border: none; padding: 8px 12px; width: 100%; text-align: left; background: none;">🗑️ Удалить страницу</button>
        </div>

        <script src="db.js"></script>
    </body>
</html>
